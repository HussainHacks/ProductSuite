[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"packages/testing/**" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
